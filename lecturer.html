<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecturer — Exam Timetable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body class="lecturer">
  <header class="topbar">
    <a class="brand" href="lecturer.html">
      <div class="brand-mark">ET</div>
      <div class="brand-text"><strong>Exam Timetable</strong><span>Lecturer</span></div>
    </a>
    <div class="topbar-right"><span id="who"></span><button class="btn ghost" id="logout">Log out</button></div>
  </header>

  <main class="viewer" id="page" hidden>
    <div class="viewer-head">
      <div>
        <h1 class="page-title" id="hello">Exam schedule</h1>
        <p class="page-sub" id="sub"></p>
      </div>
      <label class="period-pick" hidden><span class="muted small">Timetable</span><select id="period" aria-label="Timetable"></select></label>
    </div>

    <div class="tabs v-tabs two" role="tablist">
      <button role="tab" data-tab="schedule"><i class="ti ti-calendar-event"></i> Exam schedule</button>
      <button role="tab" data-tab="avail"><i class="ti ti-calendar-user"></i> My availability</button>
    </div>
    <section id="panel" class="v-panel"></section>
  </main>
  <p class="loading" id="loading">Checking your login…</p>

  <script type="module">
    import { supabase } from "./js/config.js";
    import { requireRole, setupHeader } from "./js/auth.js";
    import { esc, fmtDate, todayIso, ROLE_NAMES, loadPeriod, publishedPeriods, details, hallDetailsHtml,
             periodPicker, pdfFacultySheet, pdfBatches, pdfStaff, timetableBatches } from "./js/viewer.js";
    import { renderMyAvailability } from "./js/availability.js";

    const me = await requireRole("lecturer");
    if (me) {
      setupHeader(me.user);
      document.getElementById("loading").remove();
      document.getElementById("page").hidden = false;
      const panel = document.getElementById("panel");
      const tabs = document.querySelectorAll(".v-tabs button");

      // who am I in the staff list?
      const { data: mine } = await supabase.from("lecturers").select("id,title,full_name,grade,can_supervise,can_invigilate")
        .eq("email", me.user.email.toLowerCase()).maybeSingle();
      const myName = mine ? `${mine.title ? mine.title + " " : ""}${mine.full_name}` : me.user.email;
      document.getElementById("hello").textContent = mine ? `Hello, ${myName}` : "Exam schedule";

      const periods = await publishedPeriods().catch(() => []);

      // an open availability request still waiting for my answer?
      const { data: openRounds } = await supabase.from("availability_rounds").select("id").eq("is_open", true).gte("end_date", todayIso());
      let pendingAnswer = false;
      if (mine && openRounds?.length) {
        const { data: done } = await supabase.from("availability_responses").select("round_id").eq("lecturer_id", mine.id).in("round_id", openRounds.map((r) => r.id));
        pendingAnswer = (done || []).length < openRounds.length;
      }
      if (pendingAnswer) document.querySelector('[data-tab="avail"]').insertAdjacentHTML("beforeend", ' <span class="dot-badge" title="Please answer">!</span>');
      document.addEventListener("availability-saved", () => document.querySelector('[data-tab="avail"] .dot-badge')?.remove());

      let T = null, period = null;
      let filt = { staff: "", room: "", from: "", to: "", batch: "" };

      // ---------- helpers ----------
      const myHalls = () => mine && T ? T.halls.filter((h) => h.duties.some((d) => d.staffId === mine.id)) : [];
      const myRole = (h) => ROLE_NAMES[h.duties.find((d) => d.staffId === mine?.id)?.role] || "";
      const timeOf = (h) => h.papers.map((p) => p.exam?.time).filter(Boolean)[0] || (h.session === "AM" ? "09:00" : "13:00");
      const batchText = (h) => [...new Set(h.papers.flatMap((p) => p.exam?.streams.map((b) => `Intake ${b.intake} ${b.stream}`) || []))].join(", ");
      const co = (h) => h.duties.filter((d) => d.staffId !== mine?.id).map((d) => `${d.name} (${ROLE_NAMES[d.role]})`);
      const isMe = () => mine && filt.staff === String(mine.id);

      function filtered() {
        return T.halls.filter((h) =>
          (!filt.staff || h.duties.some((d) => String(d.staffId) === filt.staff)) &&
          (!filt.room || String(h.room.id) === filt.room) &&
          (!filt.from || h.date >= filt.from) && (!filt.to || h.date <= filt.to) &&
          (!filt.batch || h.papers.some((p) => p.exam?.streams.some((b) => String(b.id) === filt.batch))));
      }

      // ---------- EXAM SCHEDULE ----------
      function nextCard() {
        if (!mine) return `<div class="empty table-wrap"><p><strong>Your email isn't linked to a staff record.</strong></p>
          <p class="muted">You can still see the full schedule below. Ask the admin to add <b>${esc(me.user.email)}</b> to your record in Staff.</p></div>`;
        const h = myHalls().find((x) => x.date >= todayIso());
        if (!h) return `<div class="next-card slim"><div class="next-info"><span class="tag">YOUR NEXT DUTY</span>
          <p class="muted">${myHalls().length ? "All your duties in this timetable are done." : "You have no duties in this timetable."}</p></div></div>`;
        return `<div class="next-card slim">
          <div class="next-info">
            <span class="tag">YOUR NEXT DUTY</span>
            <h2>${fmtDate(h.date, { weekday: "long", day: "numeric", month: "long" })}</h2>
            <p class="next-time">${timeOf(h)} · ${h.session === "AM" ? "Morning" : "Afternoon"} session</p>
          </div>
          <dl class="kv">
            <dt>Exam hall</dt><dd><b>${esc(h.room.name)}</b>${h.room.building ? ` <span class="muted">· ${esc(h.room.building)}</span>` : ""}</dd>
            <dt>Your role</dt><dd>${myRole(h)}</dd>
            <dt>Module</dt><dd>${h.papers.map((p) => `<b>${esc(p.exam?.module.code)}</b> ${esc(p.exam?.module.name)}`).join("<br>")}</dd>
            <dt>Batch</dt><dd>${esc(batchText(h))}</dd>
            <dt>Students</dt><dd>${h.students}</dd>
            <dt>With</dt><dd>${co(h).map(esc).join("<br>") || "—"}</dd>
          </dl>
        </div>`;
      }

      function scheduleView() {
        if (!periods.length) return `<div class="empty table-wrap"><p><strong>No timetable has been published yet.</strong></p>
          <p class="muted">The exam schedule and your duties will appear here as soon as the exam office publishes it.</p></div>`;
        const staffList = [...new Map(T.halls.flatMap((h) => h.duties.map((d) => [d.staffId, d.name]))).entries()].sort((a, b) => a[1].localeCompare(b[1]));
        const rooms = [...new Map(T.halls.map((h) => [h.room.id, h.room.name])).entries()].sort((a, b) => a[1].localeCompare(b[1], undefined, { numeric: true }));
        const dates = [...new Set(T.halls.map((h) => h.date))].sort();
        const batches = timetableBatches(T);
        const hs = filtered();
        const any = filt.staff || filt.room || filt.from || filt.to || filt.batch;
        const opt = (v, l, cur) => `<option value="${v}" ${String(v) === cur ? "selected" : ""}>${esc(l)}</option>`;
        const cell = (h, r) => h.duties.filter((d) => d.role === r).map((d) =>
          d.staffId === mine?.id ? `<mark>${esc(d.name)}</mark>` : esc(d.name)).join("<br>") || "—";
        const b = filt.batch ? T.batchById[filt.batch] : null;
        return `${nextCard()}
          <h2 class="dl-title"><i class="ti ti-download"></i> Download</h2>
          <div class="dl-bar">
            ${mine ? `<button class="btn" data-dl="mine"><i class="ti ti-user"></i> My schedule</button>` : ""}
            <span class="dl-batch">
              <select id="dl-batch" aria-label="Batch to download"><option value="">Choose a batch…</option>
                ${batches.map((x) => opt(x.id, `Intake ${x.intake} · ${x.stream || x.degree}`, filt.batch)).join("")}</select>
              <button class="btn light" data-dl="batch"><i class="ti ti-school"></i> Batch timetable</button>
            </span>
            <button class="btn light" data-dl="shown" ${any ? "" : "disabled"} title="${any ? "Download the rows shown below" : "Choose a filter below first"}"><i class="ti ti-filter"></i> What's shown</button>
            <button class="btn light" data-dl="all"><i class="ti ti-file-text"></i> Whole timetable</button>
          </div>
          <div class="filters-row">
            <label><span>Lecturer</span><select data-f="staff"><option value="">Everyone</option>
              ${mine ? opt(mine.id, "★ Me", filt.staff) : ""}${staffList.filter(([id]) => id !== mine?.id).map(([id, n]) => opt(id, n, filt.staff)).join("")}</select></label>
            <label><span>Exam hall</span><select data-f="room"><option value="">All halls</option>${rooms.map(([id, n]) => opt(id, n, filt.room)).join("")}</select></label>
            <label><span>From date</span><select data-f="from"><option value="">First day</option>${dates.filter((d) => !filt.to || d <= filt.to).map((d) => opt(d, fmtDate(d, { weekday: "short", day: "numeric", month: "short" }), filt.from)).join("")}</select></label>
            <label><span>To date</span><select data-f="to"><option value="">Last day</option>${dates.filter((d) => !filt.from || d >= filt.from).map((d) => opt(d, fmtDate(d, { weekday: "short", day: "numeric", month: "short" }), filt.to)).join("")}</select></label>
            <label><span>Batch</span><select data-f="batch"><option value="">All batches</option>${batches.map((x) => opt(x.id, `Intake ${x.intake} · ${x.stream || x.degree}`, filt.batch)).join("")}</select></label>
            ${any ? '<button class="link" data-clear-f>Clear filters</button>' : ""}
          </div>
          <p class="muted small">${hs.length} of ${T.halls.length} hall sessions${b ? ` · showing the halls where Intake ${b.intake} ${esc(b.stream)} sits` : ""}${isMe() ? " · your duties" : ""}</p>
          <div class="table-wrap"><table class="data">
            <thead><tr><th>Date</th><th>Time</th><th>Exam hall</th><th>Papers</th><th>Students</th><th>Supervisor</th><th>Invigilators</th><th>Hall attendant</th></tr></thead>
            <tbody>${hs.map((h) => `<tr data-hall="${h.id}" tabindex="0" class="${h.duties.some((d) => d.staffId === mine?.id) ? "mine" : ""}" title="Click for details">
              <td>${fmtDate(h.date, { weekday: "short", day: "2-digit", month: "short" })}</td><td>${timeOf(h)}</td><td><b>${esc(h.room.name)}</b></td>
              <td>${h.papers.map((p) => `<div><b>${esc(p.exam?.module.code)}</b> <span class="muted small">${esc(p.exam?.streams.map((x) => x.stream).join(", "))}</span></div>`).join("")}</td>
              <td>${h.students}</td>
              <td>${cell(h, "SUPERVISOR")}</td><td>${cell(h, "INVIGILATOR")}</td><td>${cell(h, "ATTENDANT")}</td></tr>`).join("")
              || `<tr><td colspan="8" class="muted center">Nothing matches these filters.</td></tr>`}</tbody></table></div>`;
      }

      async function openPeriod(id) {
        panel.innerHTML = `<p class="loading">Loading…</p>`;
        T = await loadPeriod(id);
        period = periods.find((x) => x.id === id);
        document.getElementById("sub").textContent =
          `${period.name} · ${fmtDate(period.start_date, { day: "numeric", month: "long" })} – ${fmtDate(period.end_date, { day: "numeric", month: "long", year: "numeric" })}`;
        show("schedule");
      }

      function show(t) {
        tabs.forEach((b) => { b.classList.toggle("active", b.dataset.tab === t); b.setAttribute("aria-selected", b.dataset.tab === t); });
        history.replaceState(null, "", t === "avail" ? "#availability" : "#schedule");
        if (t === "avail") return renderMyAvailability(panel, mine);
        panel.innerHTML = scheduleView();
      }
      tabs.forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));

      // ---------- clicks / changes ----------
      panel.addEventListener("click", async (e) => {
        if (e.target.closest("[data-clear-f]")) { filt = { staff: "", room: "", from: "", to: "", batch: "" }; return show("schedule"); }
        const dl = e.target.closest("[data-dl]");
        if (dl) {
          const kind = dl.dataset.dl;
          dl.disabled = true;
          try {
            if (kind === "mine") await pdfStaff(T, period, mine.id, myName);
            if (kind === "all") await pdfFacultySheet(T, period, { filename: "supervisor-invigilator-list.pdf" });
            if (kind === "shown") {
              const bits = [filt.staff && `Lecturer: ${T.name(Number(filt.staff))}`, filt.room && `Hall: ${T.halls.find((h) => String(h.room.id) === filt.room)?.room.name}`,
                (filt.from || filt.to) && `Dates: ${filt.from ? fmtDate(filt.from) : "start"} to ${filt.to ? fmtDate(filt.to) : "end"}`, filt.batch && `Batch: Intake ${T.batchById[filt.batch].intake} ${T.batchById[filt.batch].stream}`].filter(Boolean);
              await pdfFacultySheet(T, period, { halls: filtered(), note: `Selection: ${bits.join(", ")}`, filename: "supervisor-invigilator-list-selection.pdf" });
            }
            if (kind === "batch") {
              const id = panel.querySelector("#dl-batch").value;
              if (!id) { alert("Choose a batch first."); return; }
              const b = T.batchById[id];
              await pdfBatches(T, period, [Number(id)], `exam-timetable-intake-${b.intake}-${String(b.stream).replace(/\W+/g, "-")}.pdf`);
            }
          } finally { dl.disabled = false; }
          return;
        }
        const hallEl = e.target.closest("[data-hall]");
        if (hallEl) {
          const h = T.hallById[Number(hallEl.dataset.hall)];
          details(`<h2>${esc(h.room.name)} · ${timeOf(h)}</h2>${hallDetailsHtml(T, h, { myStaffId: mine?.id })}`);
        }
      });
      panel.addEventListener("change", (e) => {
        if (e.target.matches("[data-f]")) { filt[e.target.dataset.f] = e.target.value; show("schedule"); }
        if (e.target.matches("#dl-batch") && !filt.batch) { /* just picks what to download */ }
      });
      panel.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("[data-hall]")) e.target.click(); });

      // ---------- start ----------
      const startTab = location.hash === "#availability" || (pendingAnswer && location.hash !== "#schedule") ? "avail" : "schedule";
      if (periods.length) {
        const first = periodPicker(document.getElementById("period"), periods, openPeriod);
        T = await loadPeriod(first);
        period = periods[0];
        document.getElementById("sub").textContent =
          `${period.name} · ${fmtDate(period.start_date, { day: "numeric", month: "long" })} – ${fmtDate(period.end_date, { day: "numeric", month: "long", year: "numeric" })}`;
      }
      show(startTab);
    }
  </script>
</body>
</html>
