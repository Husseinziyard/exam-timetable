<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a password — Exam Timetable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">ET</div>
      <div class="brand-text"><strong>Exam Timetable</strong><span>Faculty portal</span></div>
    </a>
  </header>

  <main>
    <div class="auth-box">
      <div class="bar"></div>
      <h1 id="title">Change your password</h1>
      <p class="hint" id="hint"></p>
      <form id="form">
        <label for="pw1">New password</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
        <label for="pw2">Type it again</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
        <p class="hint" style="margin:8px 0 0">At least 8 characters. Don't reuse your email password.</p>
        <button class="btn full" id="submit" type="submit">Save password</button>
      </form>
      <div class="msg" id="msg"></div>
      <a class="back" id="back" href="index.html">← Back</a>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./js/config.js";
    import { getRole, HOME } from "./js/auth.js";

    const params = new URLSearchParams(location.search);
    const first = params.get("first") === "1";
    const next = /^[\w-]+\.html$/.test(params.get("next") || "") ? params.get("next") : null;
    const msg = document.getElementById("msg");
    const show = (t, ok = false) => { msg.textContent = t; msg.className = `msg show ${ok ? "ok" : "error"}`; };

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) location.replace("index.html");
    else {
      document.getElementById("hint").textContent = first
        ? `Welcome! You logged in with a temporary password. Please choose your own password for ${session.user.email}.`
        : `Choose a new password for ${session.user.email}.`;
      if (first) { document.getElementById("title").textContent = "Choose your password"; document.getElementById("back").style.display = "none"; }
      else document.getElementById("back").href = next || "index.html";

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
        if (a.length < 8) return show("Please use at least 8 characters.");
        if (a !== b) return show("The two passwords don't match.");
        if (/^Exam-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(a)) return show("Please choose a new password, not the temporary one.");
        const btn = document.getElementById("submit");
        btn.disabled = true; btn.textContent = "Saving…";
        const { error } = await supabase.auth.updateUser({ password: a, data: { must_change_password: false } });
        btn.disabled = false; btn.textContent = "Save password";
        if (error) return show(/same/i.test(error.message) ? "That's your current password — please choose a different one." : error.message);
        show("Password saved. Taking you to your page…", true);
        await supabase.auth.refreshSession();
        let dest = next;
        if (!dest) { try { dest = HOME[await getRole()]; } catch {} }
        setTimeout(() => location.replace(dest || "index.html"), 900);
      });
    }
  </script>
</body>
</html>
