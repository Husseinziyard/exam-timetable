<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam timetable — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin workspace">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn mobile-only" id="menu" aria-label="Open menu"><i class="ti ti-menu-2"></i></button>
      <a class="brand" href="admin.html">
        <div class="brand-mark">ET</div>
        <div class="brand-text"><strong>Exam Timetable</strong><span>Admin · Exam timetable</span></div>
      </a>
    </div>
    <div class="topbar-right"><span id="who"></span><button class="btn ghost" id="logout">Log out</button></div>
  </header>

  <div class="app" id="page" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Sections">
      <nav id="nav">
        <!-- Overview row: the icon opens/closes the sidebar, the word "Overview" opens the page -->
        <div class="nav-row" data-key="overview">
          <button class="nav-icon" id="toggle" aria-expanded="false" aria-controls="sidebar" title="Open menu">
            <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
          </button>
          <a href="#overview" class="nav-text">Overview</a>
        </div>
        <div class="nav-label">Data</div>
        <!-- section links are added by the script below -->
      </nav>
      <div class="side-foot">
        <a href="admin.html" title="Admin home"><i class="ti ti-arrow-left" aria-hidden="true"></i><span>Admin home</span></a>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <section class="content" id="content" tabindex="-1"></section>
  </div>
  <p class="loading" id="loading">Checking your login…</p>

  <script type="module">
    import { requireRole, setupHeader } from "./js/auth.js";
    import { SECTIONS, NAV, ICONS } from "./js/admin-data.js";
    import { renderSection, renderOverview } from "./js/crud.js";

    const me = await requireRole("admin");
    if (me) {
      setupHeader(me.user);
      document.getElementById("loading").remove();
      const app = document.getElementById("page");
      app.hidden = false;

      const nav = document.getElementById("nav");
      const content = document.getElementById("content");
      NAV.forEach((k) => nav.insertAdjacentHTML("beforeend",
        `<a href="#${k}" data-key="${k}" title="${SECTIONS[k].title}"><i class="ti ${ICONS[k]}" aria-hidden="true"></i><span>${SECTIONS[k].title}</span></a>`));

      // ----- sidebar: closed by default; the Overview icon opens it, click again to close -----
      const toggle = document.getElementById("toggle");
      const isPhone = () => matchMedia("(max-width: 800px)").matches;
      const isOpen = () => (isPhone() ? app.classList.contains("open") : !app.classList.contains("collapsed"));
      const setOpen = (open) => {
        if (isPhone()) app.classList.toggle("open", open);   // phones: slide-in panel
        else app.classList.toggle("collapsed", !open);        // desktop: icon strip when closed
        toggle.setAttribute("aria-expanded", String(open));
        toggle.title = open ? "Close menu" : "Open menu";
      };
      app.classList.add("collapsed");
      setOpen(false);
      toggle.addEventListener("click", () => setOpen(!isOpen()));
      document.getElementById("menu").addEventListener("click", () => setOpen(true));
      document.getElementById("backdrop").addEventListener("click", () => setOpen(false));

      // ----- page switching using the part of the URL after "#" -----
      async function route() {
        const key = location.hash.slice(1) || "overview";
        app.classList.remove("open");
        nav.querySelectorAll("[data-key]").forEach((a) => a.classList.toggle("active", a.dataset.key === key));
        if (SECTIONS[key]) await renderSection(content, key);
        else await renderOverview(content, (k) => (location.hash = k));
        content.focus();
      }
      window.addEventListener("hashchange", route);
      content.addEventListener("scroll", () => document.querySelector(".col-pop")?.remove());
      route();
    }
  </script>
</body>
</html>
