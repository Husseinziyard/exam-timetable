<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam timetable — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="admin.html">
      <div class="brand-mark">ET</div>
      <div class="brand-text"><strong>Exam Timetable</strong><span>Admin · Exam timetable</span></div>
    </a>
    <div class="topbar-right"><span id="who"></span><button class="btn ghost" id="logout">Log out</button></div>
  </header>

  <div class="app" id="page" hidden>
    <nav class="sidebar" id="nav" aria-label="Sections">
      <a href="#overview" data-key="overview">Overview</a>
      <div class="nav-label">Data</div>
      <!-- section links are added by the script below -->
    </nav>
    <section class="content" id="content" tabindex="-1"></section>
  </div>
  <p class="loading" id="loading">Checking your login…</p>

  <script type="module">
    import { requireRole, setupHeader } from "./js/auth.js";
    import { SECTIONS, NAV } from "./js/admin-data.js";
    import { renderSection, renderOverview } from "./js/crud.js";

    const me = await requireRole("admin");
    if (me) {
      setupHeader(me.user);
      document.getElementById("loading").remove();
      document.getElementById("page").hidden = false;

      const nav = document.getElementById("nav");
      const content = document.getElementById("content");
      NAV.forEach((k) => nav.insertAdjacentHTML("beforeend", `<a href="#${k}" data-key="${k}">${SECTIONS[k].title}</a>`));

      // Simple page switching using the part of the URL after "#"
      async function route() {
        const key = location.hash.slice(1) || "overview";
        nav.querySelectorAll("a").forEach((a) => a.classList.toggle("active", a.dataset.key === key));
        if (SECTIONS[key]) await renderSection(content, key);
        else await renderOverview(content, (k) => (location.hash = k));
        content.focus();
      }
      window.addEventListener("hashchange", route);
      route();
    }
  </script>
</body>
</html>
